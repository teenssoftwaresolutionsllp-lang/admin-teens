name: Attendance Auto Checkout

on:
  schedule:
    # Check every 5 minutes
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      execute:
        description: "Actually perform automatic checkout"
        required: true
        type: boolean
        default: false

concurrency:
  group: attendance-auto-checkout
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  auto-checkout:
    name: Automatically Close 9-Hour Sessions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preview automatic checkout
        if: github.event_name == 'workflow_dispatch' && !inputs.execute
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/attendance/auto-checkout.ts

      - name: Execute automatic checkout
        if: github.event_name == 'schedule' || inputs.execute
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/attendance/auto-checkout.ts --execute
