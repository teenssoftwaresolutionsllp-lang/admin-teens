name: Daily Attendance Absence Automation

on:
  schedule:
    # 04:00 AM IST = 22:30 UTC (previous day)
    - cron: "30 22 * * *"

  workflow_dispatch:
    inputs:
      execute:
        description: "Actually insert attendance and send HR/CEO notifications"
        required: true
        type: boolean
        default: false
      date:
        description: "Optional attendance date (YYYY-MM-DD). Blank = previous India date."
        required: false
        type: string
      employee:
        description: "Optional employee ID, e.g. TN5103. Blank = all eligible employees."
        required: false
        type: string

concurrency:
  group: daily-absence-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process-absence:
    name: Process Daily Employee Absence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Process attendance absence
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEFAULT_HOLIDAY_CALENDAR_ID: ${{ secrets.DEFAULT_HOLIDAY_CALENDAR_ID }}
          INPUT_EXECUTE: ${{ inputs.execute }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_EMPLOYEE: ${{ inputs.employee }}
        run: |
          ARGS=()

          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            ARGS+=(--execute)
          else
            if [[ -n "$INPUT_DATE" ]]; then
              ARGS+=("--date=$INPUT_DATE")
            fi

            if [[ -n "$INPUT_EMPLOYEE" ]]; then
              ARGS+=("--employee=$INPUT_EMPLOYEE")
            fi

            if [[ "$INPUT_EXECUTE" == "true" ]]; then
              ARGS+=(--execute)
            fi
          fi

          echo "Running absence automation with arguments: ${ARGS[*]:-(default dry-run)}"
          npx tsx scripts/attendance/process-daily-absence.ts "${ARGS[@]}"
